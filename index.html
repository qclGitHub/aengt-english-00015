<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aengt · 英语二文章分析</title><style>
:root{--ink:#172033;--muted:#72809a;--line:#e8ebf2;--blue:#4169e1;--blue-soft:#edf2ff;--orange:#f18a38;--orange-soft:#fff1e7;--bg:#f7f8fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px}button{font:inherit;border:0;cursor:pointer}.app{display:flex;height:100vh;min-height:680px;overflow:hidden}.side{width:286px;background:#fff;border-right:1px solid var(--line);padding:25px 16px;display:flex;flex-direction:column;flex-shrink:0;transition:.24s}.logo{font-size:22px;font-weight:800;letter-spacing:-.8px;padding:0 9px 25px}.logo span{color:var(--blue)}.new{background:var(--blue);color:white;padding:12px 15px;text-align:left;border-radius:10px;font-weight:650;box-shadow:0 5px 12px #4169e126}.projects-label{color:#95a0b3;font-size:12px;font-weight:700;margin:26px 9px 10px;text-transform:uppercase;letter-spacing:.8px}.project{width:100%;background:transparent;padding:12px 10px;border-radius:9px;text-align:left;color:#536078;display:flex;align-items:center;gap:10px}.project:hover{background:#f5f7fc}.project.active{background:var(--blue-soft);color:#3158ce;font-weight:700}.project b{font-size:11px;padding:3px 7px;border-radius:12px;background:#e9edf7;color:#77839a;margin-left:auto}.project.active b{background:#dce6ff;color:#4169e1}.dot{width:9px;height:9px;border-radius:50%;background:#efae66}.project.active .dot{background:var(--blue)}.side-footer{margin-top:auto;border-top:1px solid var(--line);padding:17px 9px 0;color:#69768c;display:flex;gap:10px;align-items:center}.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#1d2c4d;color:#fff;font-size:12px;font-weight:700}.collapse{margin-left:auto;background:#f1f3f8;border-radius:7px;color:#6d7890;width:28px;height:28px}.workspace{min-width:0;flex:1;display:flex;flex-direction:column}.header{height:80px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 31px;gap:16px}.crumb{color:#8b96a9}.crumb strong{color:#273146}.header-right{margin-left:auto;display:flex;align-items:center;gap:13px}.progress{color:#68758c;font-size:13px}.progress b{color:#4169e1}.add-image{background:#f2f5ff;color:#4169e1;border:1px solid #d9e2ff;padding:9px 13px;border-radius:8px;font-weight:700}.analyze{background:var(--blue);color:#fff;border-radius:8px;padding:10px 15px;font-weight:700}.main{padding:25px 30px;overflow:auto;flex:1}.article-head{display:flex;align-items:start;justify-content:space-between;margin-bottom:22px}.article-head h2{font-size:23px;margin:0 0 7px}.article-head p{color:#8590a4;margin:0}.pages{display:flex;gap:7px;align-items:center}.page{height:32px;min-width:32px;padding:0 9px;border:1px solid var(--line);background:white;border-radius:8px;color:#78849a}.page.selected{background:var(--blue);color:white;border-color:var(--blue)}.reader{display:grid;grid-template-columns:minmax(390px,1.25fr) minmax(310px,.75fr);gap:20px;align-items:start}.article,.insights{background:#fff;border:1px solid var(--line);border-radius:14px}.article-top{padding:17px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.article-top h3{font-size:14px;margin:0}.source{font-size:12px;color:#8b96a9;margin-left:auto}.translate{background:#f5f7fa;color:#5f6d85;border-radius:7px;padding:7px 10px;font-size:12px;font-weight:650}.article-content{padding:24px 29px}.article-content h4{font-family:Georgia,serif;font-size:23px;margin:0 0 16px;color:#202a40}.article-content p{font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:1.9;color:#354056;margin:0 0 17px}.mark{background:#fff0b8;border-radius:3px;padding:1px 2px}.mark.blue{background:#dfe9ff}.translation{background:#f7f9fd;border-left:3px solid #a9bee9;color:#536078;font-family:inherit!important;font-size:13px!important;line-height:1.8!important;padding:13px 15px;margin-top:25px;border-radius:0 7px 7px 0}.translation.hidden{display:none}.hint{font-family:inherit!important;font-size:12px!important;color:#8c97a9!important;margin-top:18px!important}.panel-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;align-items:center}.panel-head h3{font-size:15px;margin:0}.count{margin-left:auto;background:var(--orange-soft);color:#d46e22;border-radius:12px;padding:4px 8px;font-size:11px;font-weight:700}.tabs{display:flex;gap:17px;padding:0 19px;border-bottom:1px solid var(--line)}.tab{padding:12px 1px;background:transparent;color:#8994a7;font-size:13px}.tab.active{color:#4169e1;border-bottom:2px solid #4169e1;font-weight:700}.items{padding:8px 14px 14px}.insight{padding:14px 7px;border-bottom:1px solid #eef0f5}.insight:last-child{border:0}.tag{display:inline-block;color:#3860d3;background:var(--blue-soft);font-size:11px;font-weight:700;border-radius:4px;padding:4px 6px;margin-bottom:7px}.tag.phrase{color:#c76b27;background:var(--orange-soft)}.insight h4{margin:0 0 5px;font-size:14px}.insight p{margin:0;color:#748097;font-size:12.5px;line-height:1.6}.insight .example{margin-top:8px;background:#f8f9fc;padding:8px 9px;border-radius:6px;color:#68758c;font-size:12px}.upload{display:none}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#18233c;color:#fff;border-radius:8px;padding:11px 15px;transition:.3s;font-size:13px}.toast.show{transform:translateX(-50%) translateY(0)}.side.slim{width:68px;padding:25px 10px}.side.slim .logo,.side.slim .new,.side.slim .projects-label,.side.slim .project span,.side.slim .project b,.side.slim .side-footer span{display:none}.side.slim .project{justify-content:center}.side.slim .side-footer{padding:17px 0}.side.slim .collapse{margin:auto}@media(max-width:850px){.side{width:225px}.main{padding:20px}.reader{grid-template-columns:1fr}.insights{order:-1}}@media(max-width:620px){.side{display:none}.header{padding:0 16px}.main{padding:16px}.progress{display:none}.article-content{padding:20px}.source{display:none}.reader{grid-template-columns:minmax(0,1fr)}}
</style><style>.capture{margin:0 0 20px;background:#eef3ff;border:1px dashed #a9bdf7;border-radius:12px;padding:13px 16px;display:flex;align-items:center;gap:12px;color:#50617c}.capture strong{color:#254fca}.capture span{font-size:12px}.capture .mini{margin-left:auto;background:#fff;border:1px solid #d5e0fd;padding:6px 9px;border-radius:7px;color:#4169e1}.shot-list{display:flex;gap:7px;overflow:auto;padding:8px 0 1px}.shot{height:40px;min-width:68px;background:#fff;border:1px solid #d7ddea;border-radius:6px;padding:0 8px;color:#69768c;font-size:11px;display:flex;align-items:center;gap:5px}.shot img{height:29px;width:26px;object-fit:cover;border-radius:3px}.shot button{background:#edf2ff;border-radius:4px;color:#4169e1}.editor{width:100%;min-height:140px;border:1px solid #dde3ef;border-radius:8px;padding:12px;font:15px/1.7 Georgia,serif;color:#354056;resize:vertical}.edit-area{display:none;padding:18px 22px;border-top:1px solid var(--line);background:#fbfcff}.edit-area.open{display:block}.edit-action{background:#edf2ff;color:#4169e1;border-radius:7px;padding:7px 10px;font-size:12px;font-weight:650}.modal{display:none;position:fixed;inset:0;background:#13213c66;align-items:center;justify-content:center;z-index:5}.modal.open{display:flex}.modal-card{width:min(480px,calc(100vw - 32px));background:#fff;border-radius:15px;padding:23px;box-shadow:0 18px 60px #13213c40}.modal-card h3{margin:0 0 8px;font-size:18px}.modal-card p{color:#72809a;line-height:1.6;font-size:13px}.modal-card input{width:100%;border:1px solid #dbe1eb;border-radius:8px;padding:11px;font:inherit;margin:9px 0 15px}.modal-actions{display:flex;justify-content:flex-end;gap:9px}.cancel{background:#f2f4f8;color:#69768c;border-radius:8px;padding:9px 12px}.create{background:#4169e1;color:#fff;border-radius:8px;padding:9px 14px}.saved{font-size:12px;color:#6d82a8;margin-top:10px}@media(max-width:620px){.capture{align-items:flex-start;flex-wrap:wrap}.capture .mini{margin-left:0}}</style></head><body><div class="app"><aside class="side" id="side"><div class="logo">Ae<span>ngt</span></div><button class="new" onclick="openProjectDialog()">＋ 新建分析项目</button><div class="projects-label">我的项目</div><div id="projectList"></div><div class="side-footer"><div class="avatar">兰</div><span>我的学习空间</span><button class="collapse" onclick="collapseSide()">‹</button></div></aside><section class="workspace"><header class="header"><div class="crumb">项目 / <strong id="crumb">城市与人的关系</strong></div><div class="header-right"><span class="progress" id="progress">已分析 <b>0</b> / 0 页</span><input class="upload" id="upload" type="file" accept="image/*" multiple><button class="add-image" onclick="document.getElementById('upload').click()">＋ 添加截图</button><button class="analyze" onclick="analyze()">分析文章</button></div></header><main class="main"><div class="capture"><div><strong>截图顺序</strong><span> 上传后可用箭头调整，文章将按这里的顺序整理。</span><div class="shot-list" id="shots"><span class="saved">还没有截图。可先上传，或直接在下方粘贴英文。</span></div></div><button class="mini" onclick="document.getElementById('upload').click()">添加图片</button></div><div class="article-head"><div><h2 id="articleTitle">新文章</h2><p id="articleMeta">粘贴英文或上传截图后开始分析 · 英语二（00015）</p></div></div><div class="reader"><article class="article"><div class="article-top"><h3>英文原文</h3><span class="source" id="source">本地保存</span><button class="edit-action" onclick="toggleEditor()">编辑英文</button><button class="translate" id="toggle" onclick="toggleTranslation()">显示翻译</button></div><div class="edit-area" id="editArea"><textarea class="editor" id="editor" placeholder="在这里粘贴 OCR 识别出的英文文章；每次保存后都可以重新分析。"></textarea><div class="modal-actions" style="margin-top:9px"><button class="create" onclick="saveArticle()">保存英文</button></div></div><div class="article-content"><div id="english"><p class="hint">上传文章截图后，若浏览器未提供 OCR 识别，可把识别出的英文粘贴到“编辑英文”。内容与项目会保存在当前设备。</p></div><p class="translation hidden" id="translation"></p></div></article><aside class="insights"><div class="panel-head"><h3>考点分析</h3><span class="count" id="count">0 个要点</span></div><div class="tabs"><button class="tab active" onclick="selectTab(this)">词汇短语</button><button class="tab" onclick="selectTab(this)">语法</button><button class="tab" onclick="selectTab(this)">翻译提示</button></div><div class="items" id="items"><p class="saved">保存英文后点击“分析文章”，这里会生成 00015 的学习要点。</p></div></aside></div></main></section></div><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="modal-card"><h3>新建项目</h3><p>例如：2026 年 4 月阅读真题、环境保护专题。</p><input id="projectName" placeholder="项目名称" maxlength="36"><div class="modal-actions"><button class="cancel" onclick="closeProjectDialog()">取消</button><button class="create" onclick="newProject()">创建项目</button></div></div></div><script>
const KEY='aengt-00015-v1';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{active:0,projects:[{name:'城市与人的关系',text:'',shots:[],title:'新文章'}]};
const phraseMap=[['in search of','高频搭配','寻找、搜寻。固定结构为 in search of + 名词。'],['play a role in','高频搭配','在……中发挥作用；后接名词或 doing。'],['be responsible for','高频搭配','对……负责；for 后接名词、代词或 doing。'],['as a result','连接词','因此、结果是。阅读衔接与翻译常见。'],['in order to','目的状语','为了；后接动词原形。'],['be able to','核心句型','能够做某事，to 后接动词原形。']];
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function current(){return state.projects[state.active]}function escape(s){return s.replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}function renderProjects(){let l=document.getElementById('projectList');l.innerHTML='';state.projects.forEach((p,i)=>{let b=document.createElement('button');b.className='project '+(i===state.active?'active':'');b.innerHTML='<i class="dot"></i><span>'+escape(p.name)+'</span><b>'+p.shots.length+'</b>';b.onclick=()=>{state.active=i;save();render()};l.appendChild(b)})}function renderShots(){let p=current(),box=document.getElementById('shots');if(!p.shots.length){box.innerHTML='<span class="saved">还没有截图。可先上传，或直接在下方粘贴英文。</span>';return}box.innerHTML=p.shots.map((s,i)=>'<div class="shot">'+(s.data?'<img src="'+s.data+'">':'')+'<span>'+escape(s.name)+'</span><button title="前移" onclick="moveShot('+i+',-1)">‹</button><button title="后移" onclick="moveShot('+i+',1)">›</button></div>').join('')}function renderText(){let p=current(),box=document.getElementById('english'),t=p.text.trim();document.getElementById('editor').value=p.text;document.getElementById('articleTitle').textContent=p.title||'新文章';document.getElementById('crumb').textContent=p.name;document.getElementById('progress').innerHTML='已分析 <b>'+p.shots.length+'</b> / '+p.shots.length+' 页';document.getElementById('articleMeta').textContent=t?'已保存英文 · 英语二（00015）':'粘贴英文或上传截图后开始分析 · 英语二（00015）';box.innerHTML=t?'<p>'+escape(t).replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>')+'</p>':'<p class="hint">上传文章截图后，若浏览器未提供 OCR 识别，可把识别出的英文粘贴到“编辑英文”。内容与项目会保存在当前设备。</p>'}function render(){renderProjects();renderShots();renderText();document.getElementById('items').innerHTML='<p class="saved">保存英文后点击“分析文章”，这里会生成 00015 的学习要点。</p>';document.getElementById('count').textContent='0 个要点'}function moveShot(i,d){let a=current().shots,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();renderShots();showToast('截图顺序已更新')}function toggleTranslation(){let t=document.getElementById('translation'),b=document.getElementById('toggle');t.classList.toggle('hidden');b.textContent=t.classList.contains('hidden')?'显示翻译':'隐藏翻译'}function toggleEditor(){document.getElementById('editArea').classList.toggle('open')}function saveArticle(){let p=current();p.text=document.getElementById('editor').value;p.title=p.text.split(/[.\n]/)[0].slice(0,54)||'新文章';save();renderText();showToast('英文已保存，可点击“分析文章”生成考点')}function analyze(){let text=current().text.toLowerCase();if(!text.trim()){toggleEditor();showToast('先粘贴或保存英文文章');return}let found=phraseMap.filter(x=>text.includes(x[0]));let vocab=[...new Set((current().text.match(/\b[a-zA-Z]{8,}\b/g)||[]).map(x=>x.toLowerCase()))].slice(0,4);let out=found.map(x=>'<div class="insight"><span class="tag phrase">'+x[1]+'</span><h4>'+x[0]+'</h4><p>'+x[2]+'</p><div class="example">原文中出现，建议结合整句复习。</div></div>');vocab.forEach(w=>out.push('<div class="insight"><span class="tag">核心词汇</span><h4>'+w+'</h4><p>建议记录词性、中文释义及常用搭配；这是 00015 阅读积累的基础。</p></div>'));if(!out.length)out=['<div class="insight"><span class="tag">阅读提示</span><h4>已完成基础扫描</h4><p>文章中暂未匹配内置高频搭配。可继续补充文章内容后重新分析。</p></div>'];document.getElementById('items').innerHTML=out.join('');document.getElementById('count').textContent=out.length+' 个要点';showToast('已生成 '+out.length+' 个英语二学习要点')}function collapseSide(){let s=document.getElementById('side'),b=s.querySelector('.collapse');s.classList.toggle('slim');b.textContent=s.classList.contains('slim')?'›':'‹'}function openProjectDialog(){document.getElementById('modal').classList.add('open');document.getElementById('projectName').focus()}function closeProjectDialog(){document.getElementById('modal').classList.remove('open')}function newProject(){let n=document.getElementById('projectName').value.trim();if(!n)return;state.projects.push({name:n,text:'',shots:[],title:'新文章'});state.active=state.projects.length-1;save();closeProjectDialog();render();showToast('已创建「'+n+'」')}document.getElementById('upload').addEventListener('change',e=>{let p=current();[...e.target.files].forEach(f=>{let r=new FileReader();r.onload=()=>{p.shots.push({name:f.name,data:r.result});save();renderShots();renderProjects()};r.readAsDataURL(f)});showToast('正在添加 '+e.target.files.length+' 张截图')});function showToast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2600)}function selectTab(e){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));e.classList.add('active');showToast(e.textContent+'：切换完成')}document.getElementById('projectName').addEventListener('keydown',e=>{if(e.key==='Enter')newProject()});render();
</script></body></html>
